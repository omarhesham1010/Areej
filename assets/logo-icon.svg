<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8B87A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9924A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A2C17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B4A2D;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="40" cy="40" r="40" fill="url(#bgGrad)"/>
  <!-- House shape -->
  <polygon points="40,12 14,34 20,34 20,62 60,62 60,34 66,34" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="33" y="46" width="14" height="16" rx="7" fill="url(#goldGrad)"/>
  <!-- Window left -->
  <rect x="20" y="38" width="11" height="9" rx="2" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Window right -->
  <rect x="49" y="38" width="11" height="9" rx="2" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Decorative dot at top -->
  <circle cx="40" cy="10" r="3" fill="url(#goldGrad)"/>
</svg>
